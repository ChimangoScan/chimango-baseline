name: artifact

# Runs the evaluator's own path on a clean Ubuntu runner, on every push and once a
# week. It covers the two cheap paths, which together assert every paper value: the
# bootstrap (which has to pick a Python the pinned wheels support, on a runner whose
# default may be newer) and the precomputed reproduction, which checks all 66 numbers
# without the 10.3 GB database.
#
# The full `reproduce.sh analyze` is deliberately not here: it downloads 226 MB,
# expands it to 10.3 GB and takes over an hour, which does not fit a hosted runner.

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  reviewer-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The bootstrap fetches its own interpreter with uv when the system Python is
      # out of range, which is exactly what a runner with a newer default exercises.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Bootstrap
        run: ./scripts/bootstrap.sh

      - name: Minimal test
        run: make test

      - name: Precomputed reproduction (regenerates the figures, checks all 66 values)
        run: ./reproduce.sh precomputed

      - name: The committed outputs must be untouched
        run: |
          if ! git diff --quiet -- analysis/ expected/; then
            echo "The reproduction rewrote committed analysis outputs." >&2
            git --no-pager diff --stat -- analysis/ expected/ >&2
            exit 1
          fi
          echo "analysis/ and expected/ are unchanged"
